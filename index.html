<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>awareness-space</title>
    <style>
      :root {
        --bg: #f4f1e8;
        --fg: #1d1f1a;
        --accent: #0d6b5c;
        --line: rgba(29, 31, 26, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
        color: var(--fg);
        background:
          radial-gradient(circle at top left, rgba(13, 107, 92, 0.1), transparent 35%),
          linear-gradient(180deg, #faf7ef 0%, var(--bg) 100%);
      }

      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 64px 24px 96px;
      }

      .eyebrow {
        margin: 0 0 12px;
        font-size: 13px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
      }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(40px, 8vw, 84px);
        line-height: 0.95;
        font-weight: 500;
      }

      p {
        max-width: 42rem;
        line-height: 1.9;
        font-size: 18px;
      }

      .panel {
        margin-top: 40px;
        padding: 20px 22px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.62);
        backdrop-filter: blur(10px);
      }

      ul {
        margin: 12px 0 0;
        padding-left: 20px;
        line-height: 1.9;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">awareness-space / develop</p>
      <h1>意識とは何かを<br />探索する場所</h1>
      <p>
        このページは `awareness-space` の最小入口です。GitHub Pages 公開前提で、
        `main` を公開用、`develop` を日常作業用として運用します。
      </p>
      <section class="panel">
        <strong>現状</strong>
        <ul>
          <li>作業ブランチ: `develop`</li>
          <li>公開ブランチ: `main`</li>
          <li>ローカル確認: `http://localhost:3003/`</li>
          <li>Three.js 試作: `.cache/threejs/`</li>
        </ul>
      </section>
    </main>
  </body>
</html>
