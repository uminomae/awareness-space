name: Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - 'assets/**'
      - 'transform/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - 'assets/**'
      - 'transform/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: |
          node --test tests/reports-render.test.mjs
          node --test tests/image-cards-builder.test.mjs
          node --test tests/control-guide.test.mjs
          node --test tests/page-language.test.mjs
          node --test tests/image-cards-ui.test.mjs
          node --test tests/index-html.test.mjs
