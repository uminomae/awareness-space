<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kitai background</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #c9d7ea 0%, #90abc8 42%, #48637f 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const variant = new URLSearchParams(window.location.search).get('variant') || 'raijin';
        const presets = {
            raijin: {
                speed: 0.22,
                pulseScale: 4.0,
                pulseThreshold: 0.88,
                densityLow: 0.32,
                densityHigh: 0.72,
                waterA: new THREE.Color('#061824'),
                waterB: new THREE.Color('#0d6d67'),
                glow: new THREE.Color('#7df6ff'),
            }
        };
        const config = presets[variant] || presets.raijin;

        function resolveQuality(width, height, devicePixelRatio) {
            const area = width * height;
            if (area >= 1_400_000) {
                return {
                    renderScale: Math.min(devicePixelRatio, 0.82),
                    marchSteps: 24,
                    fbmOctaves: 3,
                };
            }
            if (area >= 900_000) {
                return {
                    renderScale: Math.min(devicePixelRatio, 0.9),
                    marchSteps: 28,
                    fbmOctaves: 4,
                };
            }
            return {
                renderScale: Math.min(devicePixelRatio, 1.0),
                marchSteps: 32,
                fbmOctaves: 4,
            };
        }

        function buildMaterial(quality) {
            return new THREE.ShaderMaterial({
                defines: {
                    MARCH_STEPS: `${quality.marchSteps}`,
                    FBM_OCTAVES: `${quality.fbmOctaves}`,
                },
                vertexShader: `
                    void main() {
                        gl_Position = vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float uTime;
                    uniform vec2 uResolution;
                    uniform float uSpeed;
                    uniform float uPulseScale;
                    uniform float uPulseThreshold;
                    uniform float uDensityLow;
                    uniform float uDensityHigh;
                    uniform vec3 uWaterA;
                    uniform vec3 uWaterB;
                    uniform vec3 uGlow;

                    float hash(vec3 p) {
                        return fract(sin(dot(p, vec3(127.1, 311.7, 191.999))) * 43758.5453123);
                    }

                    float noise(vec3 p) {
                        vec3 i = floor(p);
                        vec3 f = fract(p);
                        f = f * f * (3.0 - 2.0 * f);

                        return mix(
                            mix(
                                mix(hash(i + vec3(0.0, 0.0, 0.0)), hash(i + vec3(1.0, 0.0, 0.0)), f.x),
                                mix(hash(i + vec3(0.0, 1.0, 0.0)), hash(i + vec3(1.0, 1.0, 0.0)), f.x),
                                f.y
                            ),
                            mix(
                                mix(hash(i + vec3(0.0, 0.0, 1.0)), hash(i + vec3(1.0, 0.0, 1.0)), f.x),
                                mix(hash(i + vec3(0.0, 1.0, 1.0)), hash(i + vec3(1.0, 1.0, 1.0)), f.x),
                                f.y
                            ),
                            f.z
                        );
                    }

                    float fbm(vec3 p) {
                        float value = 0.0;
                        float amp = 0.5;
                        float timeFlow = uTime * uSpeed;
                        for (int i = 0; i < FBM_OCTAVES; i++) {
                            float octave = float(i);
                            vec3 phaseOffset = vec3(
                                sin(timeFlow * 0.41 + octave * 1.13),
                                cos(timeFlow * 0.33 + octave * 0.87),
                                sin(timeFlow * 0.27 + octave * 1.57)
                            ) * (0.42 + octave * 0.08);
                            value += amp * noise(p + phaseOffset);
                            p = p * 1.92 + vec3(7.0, 13.0, 17.0) + phaseOffset;
                            amp *= 0.5;
                        }
                        return value;
                    }

                    void main() {
                        vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
                        float orbitA = uTime * 0.11;
                        float orbitB = uTime * 0.07;
                        mat2 rot = mat2(cos(orbitA), -sin(orbitA), sin(orbitA), cos(orbitA));
                        vec2 rotatedUv = rot * uv;

                        vec3 ro = vec3(
                            sin(orbitA) * 0.34 + sin(uTime * 0.031) * 0.08,
                            cos(orbitB) * 0.18 + sin(uTime * 0.043) * 0.06,
                            3.15 + sin(uTime * 0.023) * 0.12
                        );
                        vec3 rd = normalize(vec3(
                            rotatedUv + vec2(
                                sin(orbitB) * 0.07,
                                cos(orbitA) * 0.05
                            ),
                            -1.0
                        ));
                        vec3 bgTop = vec3(0.78, 0.84, 0.92);
                        vec3 bgMid = vec3(0.47, 0.60, 0.74);
                        vec3 bgLow = vec3(0.23, 0.31, 0.42);
                        float horizon = clamp(uv.y * 0.9 + 0.5, 0.0, 1.0);
                        vec3 bgColor = mix(bgLow, bgMid, smoothstep(0.0, 0.55, horizon));
                        bgColor = mix(bgColor, bgTop, smoothstep(0.45, 1.0, horizon));
                        bgColor += vec3(0.08, 0.09, 0.10) * (1.0 - smoothstep(0.0, 0.7, horizon));
                        vec3 color = bgColor;
                        float t = 0.0;
                        vec3 timeOffset = vec3(
                            sin(uTime * 0.061) * 1.3,
                            uTime * 0.05,
                            cos(uTime * 0.047) * 1.5
                        );

                        for (int i = 0; i < MARCH_STEPS; i++) {
                            vec3 p = ro + rd * t;
                            vec3 drift = vec3(
                                sin(uTime * 0.34 + p.y * 0.22),
                                cos(uTime * 0.27 + p.x * 0.18),
                                sin(uTime * 0.21 + p.z * 0.16)
                            ) * 0.16;
                            float n = fbm(p + drift + timeOffset);
                            float density = smoothstep(uDensityLow, uDensityHigh, n);
                            vec3 waterColor = mix(uWaterA, uWaterB, density) * (0.07 + density * 0.05);

                            float iface = smoothstep(0.06, 0.0, abs(n - 0.5));
                            float halo = smoothstep(0.06, 0.0, abs(n - 0.5));
                            float pulseField = noise(vec3(
                                length(p.xy) * uPulseScale - uTime * 0.22,
                                p.z * 1.25 + uTime * 0.19,
                                n * 4.2 + uTime * 0.11
                            ));
                            float pulse = smoothstep(uPulseThreshold - 0.12, 1.0, pulseField) * (0.72 + iface * 0.28);
                            vec3 emitColor = uGlow * (iface * pulse * 10.4 + halo * 0.018);

                            color += (waterColor * 0.006 + emitColor) * exp(-t * 0.4) * 0.05;
                            t += 0.078;
                        }

                        color = pow(color, vec3(1.0 / 2.2));
                        color *= 1.0 - length(uv) * 0.16;
                        gl_FragColor = vec4(color, 1.0);
                    }
                `,
                uniforms,
            });
        }

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
        renderer.setPixelRatio(1);
        document.body.appendChild(renderer.domElement);

        const uniforms = {
            uTime: { value: 0.0 },
            uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            uSpeed: { value: config.speed },
            uPulseScale: { value: config.pulseScale },
            uPulseThreshold: { value: config.pulseThreshold },
            uDensityLow: { value: config.densityLow },
            uDensityHigh: { value: config.densityHigh },
            uWaterA: { value: config.waterA },
            uWaterB: { value: config.waterB },
            uGlow: { value: config.glow },
        };

        let quality = resolveQuality(window.innerWidth, window.innerHeight, window.devicePixelRatio);
        let material = buildMaterial(quality);

        const geometry = new THREE.PlaneGeometry(2, 2);
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        function resizeRenderer(width, height) {
            const scaledWidth = Math.max(1, Math.round(width * quality.renderScale));
            const scaledHeight = Math.max(1, Math.round(height * quality.renderScale));
            renderer.setSize(scaledWidth, scaledHeight, false);
            uniforms.uResolution.value.set(scaledWidth, scaledHeight);
        }

        resizeRenderer(window.innerWidth, window.innerHeight);

        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const nextQuality = resolveQuality(width, height, window.devicePixelRatio);
            if (
                nextQuality.renderScale !== quality.renderScale ||
                nextQuality.marchSteps !== quality.marchSteps ||
                nextQuality.fbmOctaves !== quality.fbmOctaves
            ) {
                quality = nextQuality;
                const nextMaterial = buildMaterial(quality);
                mesh.material.dispose();
                mesh.material = nextMaterial;
                material = nextMaterial;
            }
            resizeRenderer(width, height);
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            uniforms.uTime.value = clock.getElapsedTime();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
