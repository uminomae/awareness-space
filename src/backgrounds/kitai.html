<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kitai background</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const variant = new URLSearchParams(window.location.search).get('variant') || 'raijin';
        const presets = {
            raijin: {
                speed: 0.22,
                pulseScale: 4.0,
                pulseThreshold: 0.88,
                densityLow: 0.32,
                densityHigh: 0.72,
                waterA: new THREE.Color('#061824'),
                waterB: new THREE.Color('#0d6d67'),
                glow: new THREE.Color('#7df6ff'),
            }
        };
        const config = presets[variant] || presets.raijin;

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
        document.body.appendChild(renderer.domElement);

        const uniforms = {
            uTime: { value: 0.0 },
            uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            uSpeed: { value: config.speed },
            uPulseScale: { value: config.pulseScale },
            uPulseThreshold: { value: config.pulseThreshold },
            uDensityLow: { value: config.densityLow },
            uDensityHigh: { value: config.densityHigh },
            uWaterA: { value: config.waterA },
            uWaterB: { value: config.waterB },
            uGlow: { value: config.glow },
        };

        const material = new THREE.ShaderMaterial({
            vertexShader: `
                void main() {
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform vec2 uResolution;
                uniform float uSpeed;
                uniform float uPulseScale;
                uniform float uPulseThreshold;
                uniform float uDensityLow;
                uniform float uDensityHigh;
                uniform vec3 uWaterA;
                uniform vec3 uWaterB;
                uniform vec3 uGlow;

                float hash(vec3 p) {
                    return fract(sin(dot(p, vec3(127.1, 311.7, 191.999))) * 43758.5453123);
                }

                float noise(vec3 p) {
                    vec3 i = floor(p);
                    vec3 f = fract(p);
                    f = f * f * (3.0 - 2.0 * f);

                    return mix(
                        mix(
                            mix(hash(i + vec3(0.0, 0.0, 0.0)), hash(i + vec3(1.0, 0.0, 0.0)), f.x),
                            mix(hash(i + vec3(0.0, 1.0, 0.0)), hash(i + vec3(1.0, 1.0, 0.0)), f.x),
                            f.y
                        ),
                        mix(
                            mix(hash(i + vec3(0.0, 0.0, 1.0)), hash(i + vec3(1.0, 0.0, 1.0)), f.x),
                            mix(hash(i + vec3(0.0, 1.0, 1.0)), hash(i + vec3(1.0, 1.0, 1.0)), f.x),
                            f.y
                        ),
                        f.z
                    );
                }

                float fbm(vec3 p) {
                    float value = 0.0;
                    float amp = 0.5;
                    for (int i = 0; i < 5; i++) {
                        float octave = float(i);
                        vec3 phaseOffset = vec3(
                            sin(uTime * uSpeed * 0.41 + octave * 1.13),
                            cos(uTime * uSpeed * 0.33 + octave * 0.87),
                            sin(uTime * uSpeed * 0.27 + octave * 1.57)
                        ) * (0.55 + octave * 0.08);
                        value += amp * noise(p + phaseOffset);
                        p = p * 1.96 + vec3(7.0, 13.0, 17.0) + phaseOffset;
                        amp *= 0.5;
                    }
                    return value;
                }

                void main() {
                    vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
                    float orbitA = uTime * uSpeed * 0.18;
                    float orbitB = uTime * uSpeed * 0.11;
                    mat2 rot = mat2(cos(orbitA), -sin(orbitA), sin(orbitA), cos(orbitA));
                    vec2 rotatedUv = rot * uv;

                    vec3 ro = vec3(
                        sin(orbitA) * 0.18,
                        cos(orbitB) * 0.11,
                        3.05
                    );
                    vec3 rd = normalize(vec3(
                        rotatedUv + vec2(
                            sin(orbitB) * 0.03,
                            cos(orbitA) * 0.025
                        ),
                        -1.0
                    ));
                    vec3 color = vec3(0.0);
                    float t = 0.0;

                    for (int i = 0; i < 48; i++) {
                        vec3 p = ro + rd * t;
                        vec3 drift = vec3(
                            sin(uTime * uSpeed * 0.53 + p.y * 0.24),
                            cos(uTime * uSpeed * 0.37 + p.x * 0.19),
                            sin(uTime * uSpeed * 0.29 + p.z * 0.17)
                        ) * 0.22;
                        float n = fbm(p + drift + vec3(0.0, uTime * 0.08, 0.0));
                        float density = smoothstep(uDensityLow, uDensityHigh, n);
                        vec3 waterColor = mix(uWaterA, uWaterB, density);

                        float iface = smoothstep(0.06, 0.0, abs(n - 0.5));
                        float pulseA = sin(
                            p.x * uPulseScale
                            + p.y * (uPulseScale + 2.0)
                            - uTime * (uPulseScale + 1.2)
                            + n * 10.0
                        );
                        float pulseB = sin(
                            length(p.xy) * (uPulseScale + 1.35)
                            - uTime * (uPulseScale + 0.4) * 0.7
                            + n * 7.0
                        );
                        float pulse = smoothstep(uPulseThreshold, 1.0, pulseA) * 0.72
                            + smoothstep(uPulseThreshold + 0.05, 1.0, pulseB) * 0.28;
                        float halo = smoothstep(0.18, 0.0, abs(n - 0.5));
                        vec3 emitColor = uGlow * (iface * pulse * 6.4 + halo * 0.42);

                        color += (waterColor * 0.1 + emitColor) * exp(-t * 0.4) * 0.05;
                        t += 0.065;
                    }

                    color = pow(color, vec3(1.0 / 2.2));
                    color *= 1.0 - length(uv) * 0.28;
                    gl_FragColor = vec4(color, 1.0);
                }
            `,
            uniforms,
        });

        const geometry = new THREE.PlaneGeometry(2, 2);
        scene.add(new THREE.Mesh(geometry, material));

        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            uniforms.uResolution.value.set(width, height);
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            uniforms.uTime.value = clock.getElapsedTime();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
